name: Source and private candidate checks
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.7.0
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run release:inventory
      - run: npm run release:pack
      # No browser acquisition/render, approval, write token, tag or publish job.

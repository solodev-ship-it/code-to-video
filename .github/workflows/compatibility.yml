name: Experimental maintained-Node compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    # Manually requested probes, not a support promise or the release gate.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: node --version
      - run: npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build:cli
      # No browser installation/render, approvals or publication.
      # Node22 remains experimental; Node24/26 installed rendering is a separate gate.

name: Installed preview platform qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.7.0
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci --no-audit --no-fund
      - run: npm run release:pack:preview -- --preview-version 0.1.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-candidate
          path: |
            renders/release-checks/candidate-*/*.tgz
            renders/release-checks/candidate-*/report.json
          if-no-files-found: error
          retention-days: 14
  installed:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24.7.0', '26.13.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: preview-candidate
          path: renders/release-checks
      - name: Install, Save, restart, render and decode
        shell: bash
        run: |
          REPORT=$(node -e 'const fs=require("fs"); const p="renders/release-checks"; const a=fs.readdirSync(p).filter(n=>n.startsWith("candidate-")); if(a.length!==1) process.exit(1); process.stdout.write(p+"/"+a[0]+"/report.json")')
          npm run qa:persistence -- "$REPORT" --hosted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-evidence-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            renders/release-checks/candidate-*/persistence-check-*/report.json
            renders/release-checks/candidate-*/persistence-check-*/consumer-package-lock.json
            renders/release-checks/candidate-*/persistence-check-*/*.mp4
          if-no-files-found: warn
          retention-days: 14
      # No registry publication, tags, releases or baseline changes.
